<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnLab</title>
  <meta name="description" content="A personal, interactive learning platform: courses with live demos, quizzes, spaced review and notes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <script>
    try { const t = localStorage.getItem('ll-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}
  </script>
</head>
<body>
  <div class="progress-bar" id="readProgress"></div>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-logo"></span>
      <span class="brand-text">Learn<b>Lab</b></span>
    </a>
    <button class="search-trigger" id="searchBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Search all courses…</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-right">
      <a class="chip" id="streakChip" href="#/" title="Days in a row you studied">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 2c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z" fill="currentColor"/></svg>
        <span id="streakVal">0</span>
      </a>
      <div class="chip" id="xpChip" title="Experience points: earned by finishing lessons, quizzes and reviews">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 2l2.9 6.6L22 9.3l-5.4 4.9L18.2 22 12 18.3 5.8 22l1.6-7.8L2 9.3l7.1-.7z" fill="currentColor"/></svg>
        <span id="xpVal">0</span>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light / dark">
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar"><nav id="nav"></nav></aside>
  <div class="scrim" id="scrim"></div>

  <main id="main" class="main"><div class="boot">Loading courses…</div></main>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-box">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="Try: ResNet, IoU, focal loss, CLIP…" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <canvas id="confetti"></canvas>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
